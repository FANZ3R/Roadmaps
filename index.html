<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Roadmaps</title>
  <meta name="description" content="Career roadmaps with progress tracking: data scientist, ML engineer, AI engineer and forward deployed engineer.">
  <meta name="theme-color" content="#F2F4F7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0F1622" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='13' y='0' width='6' height='32' rx='3' fill='%232257C9'/%3E%3Ccircle cx='16' cy='16' r='8' fill='%23ffffff' stroke='%2316202E' stroke-width='4'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Overpass:ital,wght@0,400;0,600;0,700;0,800;1,400&display=swap">
  <link rel="stylesheet" href="assets/style.css">
  <script>
    (function () {
      try {
        var theme = localStorage.getItem("roadmaps:theme");
        if (theme === "light" || theme === "dark") document.documentElement.setAttribute("data-theme", theme);
      } catch (e) { /* storage unavailable */ }
    })();
    window.RM = {
      site: { owner: "FANZ3R", title: "roadmaps" },
      topics: {},
      roadmaps: [],
      dupes: [],
      addTopics: function (obj) {
        for (var id in obj) {
          if (Object.prototype.hasOwnProperty.call(this.topics, id)) this.dupes.push(id);
          this.topics[id] = obj[id];
        }
      },
      addRoadmap: function (roadmap) { this.roadmaps.push(roadmap); }
    };
  </script>

  <!-- Topic library: shared by every roadmap -->
  <script src="data/topics/core.js"></script>
  <script src="data/topics/math-stats.js"></script>
  <script src="data/topics/data-analysis.js"></script>
  <script src="data/topics/ml.js"></script>
  <script src="data/topics/deep-learning.js"></script>
  <script src="data/topics/llm.js"></script>
  <script src="data/topics/infra.js"></script>
  <script src="data/topics/field.js"></script>
  <script src="data/topics/career.js"></script>

  <!-- Roadmaps: shown in this order. Add a new one by adding a file and a line here. -->
  <script src="data/roadmaps/data-scientist.js"></script>
  <script src="data/roadmaps/ml-engineer.js"></script>
  <script src="data/roadmaps/ai-engineer.js"></script>
  <script src="data/roadmaps/forward-deployed-engineer.js"></script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>

  <header class="top">
    <a class="wordmark" href="#/" id="wordmark">roadmaps</a>
    <div class="top-actions">
      <button type="button" class="sync-status" id="sync-status" data-act="open-settings" aria-label="Sync status. Open settings">
        <span class="sync-dot" aria-hidden="true"></span><span class="sync-text">Saved on this device</span>
      </button>
      <button type="button" class="btn btn-quiet" data-act="open-settings">Settings</button>
    </div>
  </header>

  <nav class="lines" id="lines" aria-label="Roadmaps"></nav>
  <div id="warnings"></div>
  <main id="main" tabindex="-1"></main>

  <dialog id="settings" aria-labelledby="settings-title"></dialog>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <noscript><p class="noscript">This tracker needs JavaScript to run.</p></noscript>
  <script src="assets/app.js"></script>
</body>
</html>
